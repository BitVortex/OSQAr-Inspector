name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      CI: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Check contract changes against baseline
        run: uv run python tests/probes/contract_change.py "$BASE_REVISION"

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uv run python -m osqar_inspector.release_gate dist/*

      - name: Exercise installed wheel outside checkout
        run: uv run python tests/probes/installed_package.py dist/*.whl

      - name: Generate distribution checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
