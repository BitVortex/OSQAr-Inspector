[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osqar-inspector"
version = "0.1.0"
description = "Deterministic evidence-bundle inspection companion for OSQAr workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=45,<47",
]

[project.scripts]
osqar-inspector = "osqar_inspector.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/osqar_inspector"]
