[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osqar-inspector"
version = "0.1.0"
description = "Closed-bundle verifier for OSQAr Inspector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
osqar-inspector = "osqar_inspector.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/osqar_inspector"]
